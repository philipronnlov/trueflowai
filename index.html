  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 transform: translateY(0px); } 50% { transform: translateY(-14px); } }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background: oklch(0.10 0 0); color: oklch(0.97 0.002 90); min-height: 100vh; overflow-x: hidden;\">\n\n  <!-- NAV -->\n  <nav style=\"position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 20px 48px; background: oklch(0.10 0 0 / 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid oklch(1 0 0 / 0.08);\">\n    <div style=\"display: flex; align-items: center; gap: 12px;\">\n      <img src=\"23c93d81-702d-4225-80c2-7b8b4309f8d2\" alt=\"Trueflow AI\" style=\"width: 36px; height: 36px; object-fit: contain; filter: brightness(1.4);\">\n      <span style=\"font-size: 19px; font-weight: 700; letter-spacing: 0.02em;\">TRUEFLOW <span style=\"color: oklch(0.65 0.01 90); font-weight: 500;\">AI<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: center; gap: 36px;\">\n      <a href=\"#features\" style=\"font-size: 15px; color: oklch(0.85 0.002 90);\">Features<\u002Fa>\n      <a href=\"#about\" style=\"font-size: 15px; color: oklch(0.85 0.002 90);\">About<\u002Fa>\n      <a href=\"#faq\" style=\"font-size: 15px; color: oklch(0.85 0.002 90);\">FAQ<\u002Fa>\n    <\u002Fdiv>\n    <a href=\"#contact\" style=\"padding: 11px 22px; border-radius: 8px; background: linear-gradient(135deg, oklch(0.92 0.002 90), oklch(0.72 0.004 90)); color: oklch(0.12 0 0); font-weight: 600; font-size: 14.5px;\">Book a call<\u002Fa>\n  <\u002Fnav>\n\n  <!-- HERO -->\n  <section style=\"position: relative; padding: 120px 48px 140px; display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden;\">\n    <div style=\"position: absolute; top: -200px; left: 50%; transform: translateX(-50%); width: 900px; height: 500px; background: radial-gradient(circle, oklch(0.35 0.02 240 / 0.25), transparent 70%); pointer-events: none;\"><\u002Fdiv>\n\n    <div style=\"display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; border-radius: 999px; border: 1px solid oklch(1 0 0 / 0.12); background: oklch(1 0 0 / 0.04); font-size: 13.5px; color: oklch(0.75 0.01 90); margin-bottom: 32px; z-index: 1;\">\n      <span style=\"width: 6px; height: 6px; border-radius: 50%; background: oklch(0.75 0.15 145);\"><\u002Fspan>\n      Workflow automation for growing businesses\n    <\u002Fdiv>\n\n    <h1 style=\"font-size: 68px; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; max-width: 880px; margin: 0 0 26px; z-index: 1;\">\n      Efficient workflows,<br>\n      <span style=\"background: linear-gradient(90deg, oklch(0.95 0.005 90), oklch(0.6 0.01 240), oklch(0.95 0.005 90)); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 6s linear infinite;\">built by AI, for SMEs.<\u002Fspan>\n    <\u002Fh1>\n    <p style=\"font-size: 19px; color: oklch(0.68 0.005 90); max-width: 560px; line-height: 1.6; margin: 0 0 40px; z-index: 1;\">\n      Trueflow is an AI agency that designs and deploys custom automation for small and mid-sized teams — so your people spend less time on busywork and more time on the work that matters.\n    <\u002Fp>\n    <div style=\"display: flex; gap: 16px; z-index: 1;\">\n      <a href=\"#contact\" style=\"padding: 15px 30px; border-radius: 9px; background: linear-gradient(135deg, oklch(0.94 0.002 90), oklch(0.7 0.004 90)); color: oklch(0.12 0 0); font-weight: 700; font-size: 15.5px;\">Book a call<\u002Fa>\n      <a href=\"#features\" style=\"padding: 15px 30px; border-radius: 9px; border: 1px solid oklch(1 0 0 / 0.16); color: oklch(0.92 0.002 90); font-weight: 600; font-size: 15.5px;\">See what we automate<\u002Fa>\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 90px; width: 100%; max-width: 220px; z-index: 1; animation: float 5s ease-in-out infinite;\">\n      <img src=\"23c93d81-702d-4225-80c2-7b8b4309f8d2\" alt=\"\" style=\"width: 100%; filter: drop-shadow(0 30px 60px oklch(0 0 0 / 0.6));\">\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FEATURES -->\n  <section id=\"features\" style=\"padding: 100px 48px; border-top: 1px solid oklch(1 0 0 / 0.08);\">\n    <div style=\"max-width: 620px; margin: 0 auto 64px; text-align: center;\">\n      <div style=\"font-size: 13.5px; font-weight: 600; letter-spacing: 0.08em; color: oklch(0.6 0.01 240); text-transform: uppercase; margin-bottom: 14px;\">What we build<\u002Fdiv>\n      <h2 style=\"font-size: 42px; font-weight: 800; letter-spacing: -0.015em; margin: 0 0 16px;\">Every process, automated end to end<\u002Fh2>\n      <p style=\"font-size: 17px; color: oklch(0.65 0.005 90); line-height: 1.6; margin: 0;\">From your CRM to your inbox, Trueflow wires AI agents into the tools you already use.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; max-width: 1180px; margin: 0 auto;\">\n      <sc-for list=\"{{ features }}\" as=\"f\" hint-placeholder-count=\"4\">\n        <div style=\"background: oklch(0.13 0 0); border: 1px solid oklch(1 0 0 / 0.08); border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"width: 44px; height: 44px; border-radius: 11px; background: linear-gradient(135deg, oklch(0.9 0.002 90 / 0.14), oklch(0.6 0.004 90 / 0.06)); display: flex; align-items: center; justify-content: center;\">\n            <div style=\"width: 18px; height: 18px; border-radius: {{ f.shape }}; background: linear-gradient(135deg, oklch(0.95 0.002 90), oklch(0.68 0.004 90));\"><\u002Fdiv>\n          <\u002Fdiv>\n          <h3 style=\"font-size: 19px; font-weight: 700; margin: 0;\">{{ f.title }}<\u002Fh3>\n          <p style=\"font-size: 15px; color: oklch(0.62 0.005 90); line-height: 1.6; margin: 0;\">{{ f.desc }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ABOUT -->\n  <section id=\"about\" style=\"padding: 110px 48px; background: oklch(0.08 0 0); border-top: 1px solid oklch(1 0 0 / 0.08); border-bottom: 1px solid oklch(1 0 0 / 0.08);\">\n    <div style=\"max-width: 1280px; margin: 0 auto;\">\n      <div style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.14em; color: oklch(0.55 0.005 90); text-transform: uppercase; margin-bottom: 28px;\">About<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 90px;\">\n        <div>\n          <h2 style=\"font-size: 58px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.08; margin: 0 0 44px;\">Our<br>Philosophy<\u002Fh2>\n          <p style=\"font-size: 17px; color: oklch(0.55 0.005 90); line-height: 1.7; max-width: 460px; margin: 0 0 56px;\">Our focus is simple: build AI that actually works. We design tailored AI agents and automations that reduce manual work, streamline processes, and support smarter decision-making — without unnecessary complexity.<\u002Fp>\n\n          <div style=\"border-top: 1px solid oklch(1 0 0 / 0.1); padding-top: 36px; display: flex; gap: 56px;\">\n            <div>\n              <div style=\"font-size: 26px; font-weight: 500; line-height: 1.2; margin-bottom: 10px;\">Custom-designed<\u002Fdiv>\n              <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.14em; color: oklch(0.5 0.005 90); text-transform: uppercase;\">Workflows<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size: 26px; font-weight: 500; line-height: 1.2; margin-bottom: 10px;\">End-to-end<\u002Fdiv>\n              <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.14em; color: oklch(0.5 0.005 90); text-transform: uppercase;\">Deployment<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"display: flex; flex-direction: column; gap: 40px; margin-bottom: 48px;\">\n            <sc-for list=\"{{ pillars }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div style=\"border-left: 1px solid oklch(1 0 0 / 0.14); padding-left: 28px;\">\n                <h3 style=\"font-size: 24px; font-weight: 500; margin: 0 0 12px;\">{{ p.title }}<\u002Fh3>\n                <p style=\"font-size: 15.5px; color: oklch(0.55 0.005 90); line-height: 1.6; margin: 0; max-width: 460px;\">{{ p.desc }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"border: 1px solid oklch(1 0 0 / 0.12); border-radius: 14px; padding: 32px; max-width: 460px; margin-left: auto;\">\n            <p style=\"font-size: 18px; font-style: italic; color: oklch(0.75 0.005 90); line-height: 1.6; margin: 0;\">\"We don't just build AI solutions — we simplify the complex, making technology work for people, not the other way around.\"<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FAQ -->\n  <section id=\"faq\" style=\"padding: 100px 48px;\">\n    <div style=\"max-width: 720px; margin: 0 auto;\">\n      <div style=\"text-align: center; margin-bottom: 56px;\">\n        <div style=\"font-size: 13.5px; font-weight: 600; letter-spacing: 0.08em; color: oklch(0.6 0.01 240); text-transform: uppercase; margin-bottom: 14px;\">FAQ<\u002Fdiv>\n        <h2 style=\"font-size: 36px; font-weight: 800; letter-spacing: -0.015em; margin: 0;\">Common questions<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <sc-for list=\"{{ faqs }}\" as=\"item\" hint-placeholder-count=\"5\">\n          <div style=\"border: 1px solid oklch(1 0 0 / 0.09); border-radius: 12px; background: oklch(0.12 0 0); overflow: hidden;\">\n            <div sc-camel-on-click=\"{{ item.toggle }}\" style=\"padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; gap: 20px;\">\n              <span style=\"font-size: 16px; font-weight: 600;\">{{ item.q }}<\u002Fspan>\n              <span style=\"font-size: 20px; color: oklch(0.6 0.005 90); flex-shrink: 0; transform: {{ item.rotate }}; transition: transform 0.2s;\">+<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ item.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding: 0 24px 20px; font-size: 15px; color: oklch(0.63 0.005 90); line-height: 1.65;\">{{ item.a }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CONTACT -->\n  <section id=\"contact\" style=\"padding: 110px 48px; border-top: 1px solid oklch(1 0 0 / 0.08); position: relative; overflow: hidden;\">\n    <div style=\"max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 90px;\">\n      <div>\n        <div style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.14em; color: oklch(0.55 0.005 90); text-transform: uppercase; margin-bottom: 36px;\">Contact<\u002Fdiv>\n        <h2 style=\"font-size: 60px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.08; margin: 0 0 40px; font-family: 'Inter', sans-serif;\">Let's Work<br>Together<\u002Fh2>\n        <p style=\"font-size: 17px; color: oklch(0.55 0.005 90); line-height: 1.7; max-width: 460px; margin: 0 0 56px;\">We approach each project with curiosity, rigor, and a commitment to excellence. Our process begins with listening, understanding your vision, and translating it into solutions that exceed expectations.<\u002Fp>\n        <div style=\"margin-bottom: 32px;\">\n          <div style=\"font-size: 12.5px; font-weight: 600; letter-spacing: 0.14em; color: oklch(0.5 0.005 90); text-transform: uppercase; margin-bottom: 10px;\">Email<\u002Fdiv>\n          <div style=\"font-size: 22px; color: oklch(0.95 0.002 90);\">support@trueflow.com<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size: 12.5px; font-weight: 600; letter-spacing: 0.14em; color: oklch(0.5 0.005 90); text-transform: uppercase; margin-bottom: 10px;\">Location<\u002Fdiv>\n          <div style=\"font-size: 22px; color: oklch(0.95 0.002 90);\">Stockholm, Sweden<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <h3 style=\"font-size: 30px; font-weight: 500; margin: 0 0 40px;\">Send a message<\u002Fh3>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px;\">\n          <div>\n            <label style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.14em; color: oklch(0.5 0.005 90); text-transform: uppercase; display: block; margin-bottom: 12px;\">Name<\u002Flabel>\n            <input type=\"text\" value=\"{{ form.name }}\" sc-camel-on-change=\"{{ form.setName }}\" placeholder=\"Your name\" style=\"width: 100%; box-sizing: border-box; background: transparent; border: 1px solid oklch(1 0 0 / 0.14); border-radius: 8px; padding: 14px 16px; color: oklch(0.95 0.002 90); font-size: 15px; font-family: 'Inter', sans-serif;\">\n          <\u002Fdiv>\n          <div>\n            <label style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.14em; color: oklch(0.5 0.005 90); text-transform: uppercase; display: block; margin-bottom: 12px;\">Email<\u002Flabel>\n            <input type=\"email\" value=\"{{ form.email }}\" sc-camel-on-change=\"{{ form.setEmail }}\" placeholder=\"you@company.com\" style=\"width: 100%; box-sizing: border-box; background: transparent; border: 1px solid oklch(1 0 0 / 0.14); border-radius: 8px; padding: 14px 16px; color: oklch(0.95 0.002 90); font-size: 15px; font-family: 'Inter', sans-serif;\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-bottom: 24px;\">\n          <label style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.14em; color: oklch(0.5 0.005 90); text-transform: uppercase; display: block; margin-bottom: 12px;\">Company<\u002Flabel>\n          <input type=\"text\" value=\"{{ form.company }}\" sc-camel-on-change=\"{{ form.setCompany }}\" placeholder=\"Your company\" style=\"width: 100%; box-sizing: border-box; background: transparent; border: 1px solid oklch(1 0 0 / 0.14); border-radius: 8px; padding: 14px 16px; color: oklch(0.95 0.002 90); font-size: 15px; font-family: 'Inter', sans-serif;\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom: 32px;\">\n          <label style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.14em; color: oklch(0.5 0.005 90); text-transform: uppercase; display: block; margin-bottom: 12px;\">Message<\u002Flabel>\n          <textarea value=\"{{ form.message }}\" sc-camel-on-change=\"{{ form.setMessage }}\" placeholder=\"Tell us about your project...\" rows=\"6\" style=\"width: 100%; box-sizing: border-box; background: transparent; border: 1px solid oklch(1 0 0 / 0.14); border-radius: 8px; padding: 14px 16px; color: oklch(0.95 0.002 90); font-size: 15px; font-family: 'Inter', sans-serif; resize: vertical;\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ form.submit }}\" style=\"width: 100%; padding: 17px; border-radius: 9px; background: oklch(0.97 0.002 90); border: none; color: oklch(0.1 0 0); font-weight: 600; font-size: 16px; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;\">\n          {{ form.buttonLabel }} <span>→<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n\n  <!-- FOOTER -->\n  <footer style=\"padding: 40px 48px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid oklch(1 0 0 / 0.08); font-size: 13.5px; color: oklch(0.5 0.005 90);\">\n    <div style=\"display: flex; align-items: center; gap: 10px;\">\n      <img src=\"23c93d81-702d-4225-80c2-7b8b4309f8d2\" alt=\"\" style=\"width: 20px; height: 20px; object-fit: contain; opacity: 0.8;\">\n      <span>© 2026 Trueflow AI · Founded 2025 in Stockholm<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 28px;\">\n      <a href=\"#features\" style=\"color: oklch(0.5 0.005 90);\">Features<\u002Fa>\n      <a href=\"#about\" style=\"color: oklch(0.5 0.005 90);\">About<\u002Fa>\n      <a href=\"#faq\" style=\"color: oklch(0.5 0.005 90);\">FAQ<\u002Fa>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    openFaq: 0,\n    name: '',\n    email: '',\n    company: '',\n    message: '',\n    submitted: false,\n  };\n\n  features = [\n    { title: 'Lead & inbox triage', desc: 'AI agents read, sort, and route incoming leads and emails so nothing sits unanswered.', shape: '4px' },\n    { title: 'CRM auto-updates', desc: 'Calls, deals, and notes sync into your CRM automatically — no more manual data entry.', shape: '50%' },\n    { title: 'Reporting on autopilot', desc: 'Daily and weekly rollups delivered where your team already works, generated with zero clicks.', shape: '3px' },\n    { title: 'Custom agent builds', desc: 'Need something specific? We design and ship bespoke automations for your exact process.', shape: '50%' },\n    { title: 'Supplier-manufacturer sync', desc: 'AI agents handle order updates, confirmations, and status checks between suppliers and manufacturers automatically.', shape: '4px' },\n  ];\n\n  pillars = [\n    { title: 'Innovation First', desc: 'We stay at the cutting edge of AI technology to deliver the most effective solutions for your business.' },\n    { title: 'Results Driven', desc: 'Every solution is designed with measurable outcomes and real business impact in mind.' },\n    { title: 'Partnership Approach', desc: 'We work alongside your team, ensuring knowledge transfer and long-term success.' },\n  ];\n\n  faqData = [\n    { q: 'What kinds of businesses do you work with?', a: 'Mostly SMEs between 5 and 200 employees — agencies, ecommerce brands, and service businesses with repeatable manual work.' },\n    { q: 'How long does a typical build take?', a: 'Most workflows go live in 1-3 weeks depending on scope. We start with the highest-impact process first.' },\n    { q: 'Do you replace our existing tools?', a: 'No — we build on top of what you already use. Trueflow connects and automates, it doesn\\'t force a migration.' },\n    { q: 'What does ongoing support look like?', a: 'Every client gets a dedicated engineer who monitors, maintains, and extends the automations as your business changes.' },\n    { q: 'How is pricing structured?', a: 'A flat monthly fee based on the number and complexity of active workflows. We\\'ll quote it on your call.' },\n  ];\n\n  toggleFaq(i) {\n    this.setState(s => ({ openFaq: s.openFaq === i ? -1 : i }));\n  }\n\n  renderVals() {\n    return {\n      features: this.features,\n      pillars: this.pillars,\n      faqs: this.faqData.map((f, i) => ({\n        q: f.q,\n        a: f.a,\n        open: this.state.openFaq === i,\n        rotate: this.state.openFaq === i ? 'rotate(45deg)' : 'rotate(0deg)',\n        toggle: () => this.toggleFaq(i),\n      })),\n      form: {\n        name: this.state.name,\n        email: this.state.email,\n        company: this.state.company,\n        message: this.state.message,\n        setName: e => this.setState({ name: e.target.value }),\n        setEmail: e => this.setState({ email: e.target.value }),\n        setCompany: e => this.setState({ company: e.target.value }),\n        setMessage: e => this.setState({ message: e.target.value }),\n        buttonLabel: this.state.submitted ? 'Message sent' : 'Send Message',\n        submit: () => {\n          this.setState({ submitted: true });\n          setTimeout(() => this.setState({ submitted: false, name: '', email: '', company: '', message: '' }), 2000);\n        },\n      },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
